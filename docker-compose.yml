services:
  db:
    image: postgres:16-alpine
    container_name: vacession-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: vacession
      POSTGRES_PASSWORD: vacession
      POSTGRES_DB: vacession
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
